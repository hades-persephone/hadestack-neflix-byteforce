spring.application.name=search-service
server.port=8084

services.user-service.url=http://localhost:8082
services.auth-service.url=http://localhost:8081

spring.elasticsearch.uris=http://localhost:9200

# Advanced Elasticsearch Configuration
spring.elasticsearch.connection-timeout=5000
spring.elasticsearch.socket-timeout=30000
spring.elasticsearch.username=
spring.elasticsearch.password=
spring.elasticsearch.use-ssl=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka common config
spring.kafka.bootstrap-servers=localhost:9092

# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.max.block.ms=60000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=16384
spring.kafka.producer.properties.buffer.memory=33554432
spring.kafka.producer.properties.enable.idempotence=true

# Consumer config
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=io.watch.search.model.*
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.fetch-max-wait=300000
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-commit-interval=5000
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
