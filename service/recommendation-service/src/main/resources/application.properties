spring.application.name=recommendation-service

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks

spring.cassandra.keyspace-name=recommendation
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042

spring.data.redis.host=localhost
spring.data.redis.port=6379

resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.movieService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.movieService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.movieService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.movieService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.movieService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.redisConsumer.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisConsumer.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisConsumer.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisConsumer.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redisConsumer.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.cassandraConsumer.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cassandraConsumer.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cassandraConsumer.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.cassandraConsumer.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.cassandraConsumer.registerHealthIndicator=true


# Kafka common config
spring.kafka.bootstrap-servers=localhost:9092

# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer config
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=io.watch.recommendation.service
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.fetch-max-wait=300000
