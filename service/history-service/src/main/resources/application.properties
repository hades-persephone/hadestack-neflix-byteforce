spring.application.name=history-service
server.port=9056

# Cassandra Configuration
spring.cassandra.keyspace-name=history_user_movie
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
spring.cassandra.local-datacenter=dc1
spring.cassandra.request.timeout=10s
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s

# Application specific settings
action-history.ttl-days=365
action-history.async-processing=true
action-history.batch-size=100

app.request-info.enabled=true
app.request-info.strategy=STANDARD
app.request-info.async=true
app.request-info.cache.enabled=true
app.request-info.cache.ttl=300
logging.level.io.watch.history.aspect=DEBUG


spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379
cache.redis.ttl.default=7
cache.redis.ttl.movies=14
cache.redis.ttl.series=24
cache.redis.compression.enabled=true
cache.local.enabled=true
cache.local.maximum-size=10000
cache.local.ttl=10

logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
logging.level.com.datastax.oss.driver.internal.core=DEBUG
logging.level.org.springframework.data.cassandra.core.cql=DEBUG