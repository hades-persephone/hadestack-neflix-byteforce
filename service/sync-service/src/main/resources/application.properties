spring.application.name=sync-service
server.port=9055

# Postgresql second sync database
spring.datasource.url=jdbc:postgresql://localhost:6579/byteforce_read
spring.datasource.username=hades
spring.datasource.password=hades
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.show_sql=false

# tracing log
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cdc-consumer-group
cdc.topics.listen=dbsync.directors,dbsync.movies,dbsync.series,dbsync.categories,dbsync.actors,dbsync.languages,dbsync.subtitles

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.io.watch.movie=DEBUG