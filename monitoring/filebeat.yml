filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/container/*/*.log'
    include_lines: ['.*']
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: "message"
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_fields:
      target: environment
      fields:
        datacenter: local
        environment: development

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]
