global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: /_prometheus/metrics
    scrape_interval: 30s
  - job_name: 'logstash'
    static_configs:
      - targets: ['logstash:9600']
    metrics_path: /_node/stats
    scrape_interval: 30s

  # service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8080']
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8080']
  - job_name: 'content-service'
    static_configs:
      - targets: ['content-service:8080']
  - job_name: 'streaming-service'
    static_configs:
      - targets: ['streaming-service:8080']
  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8080']
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8000']

storage:
  tsdb:
    retention.time: 15d
    retention.size: 15GB