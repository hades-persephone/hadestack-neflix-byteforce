input {
    beats {
        port => 5044
    }
}

filter {
    if [message] =~ /^\{.*\}$/ {
        json {
            source => "message"
        }
    }

    if [container][name] {
        mutate {
            add_field => { "service_name" => "%{[container][name]}" }
        }
    }

    if [timestamp] {
        date {
            match => [ "timestamp", "ISO8601" ]
        }
    }

    if [message] =~ /(?i)(ERROR|WARN|INFO|DEBUG|TRACE|FATAL)/ {
        grok {
            match => { "message" => "%{LOGLEVEL:log_level}" }
            match => { "message" => "%{TIMESTAMP_ISO8601} %{LOGLEVEL:log_level}%{GREEDYDATA}" }
            match => { "message" => "%{LOGLEVEL:log_level}" }
            match => { "message" => "^%{LOGLEVEL:log_level}" }
            match => { "message" => "%{LOGLEVEL:log_level} %{GREEDYDATA:rest_of_message}" }
        }
        mutate {
            uppercase => [ "log_level" ]
        }
    }

    mutate {
        remove_field => [ "agent", "ecs", "host", "input" ]
    }
}

output {
    elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "logs-%{+YYYY.MM.dd}"
    }
}
