services:
  byteforce-primary-db:
    image: postgres:16
    container_name: byteforce-primary-db
    environment:
      POSTGRES_USER: hades
      POSTGRES_DB: byteforce
      POSTGRES_PASSWORD: hades
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - primary-data:/var/lib/postgresql/data
    networks:
      - byteforce-net
    ports:
      - "6578:5432"
    command:
      -c wal_level=logical
      -c max_wal_senders=4
      -c max_replication_slots=4
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
    deploy:
      resources:
        limits:
          memory: 256M

  byteforce-second-db:
    image: postgres:16
    container_name: byteforce-second-db
    environment:
      POSTGRES_USER: hades
      POSTGRES_DB: byteforce_read
      POSTGRES_PASSWORD: hades
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - secondary-data:/var/lib/postgresql/data
    networks:
      - byteforce-net
    ports:
      - "6579:5432"
    command:
      -c wal_level=logical
      -c hot_standby=on
      -c primary_conninfo='host=postgres-primary port=6578 user=hades password=hades'
      -c recovery_target_timeline='latest'
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 192M

  cassandra:
    image: cassandra:5.0.4
    container_name: cassandra
    restart: always
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_START_RPC: "true"
      CASSANDRA_CLUSTER_NAME: "byteforce-cluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      JVM_OPTS: "-Xms256M -Xmx512M -XX:+UseG1GC"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 768M

  jaegertracing:
    image: jaegertracing/all-in-one:latest
    container_name: jaegertracing
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: 10000
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "9411:9411"
      - "4317:4317"
    deploy:
      resources:
        limits:
          memory: 256M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          memory: 256M

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
    deploy:
      resources:
        limits:
          memory: 768M

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:+UseG1GC -Djava.awt.headless=true"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    deploy:
      resources:
        limits:
          memory: 1G

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-configs
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_PORT: 8083
      CONNECT_LOG4J_LOGLEVEL: INFO
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC"
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  # Debezium PostgreSQL
  debezium-postgres:
    image: debezium/postgres:17-alpine
    container_name: debezium-postgres
    environment:
      POSTGRES_USER: debezium
      POSTGRES_PASSWORD: debezium
      POSTGRES_DB: inventory
      POSTGRES_SHARED_BUFFERS: 32MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 64MB
    ports:
      - "5455:5455"
    networks:
      - default
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  # Kong Database
  kong-database:
    image: postgres:16
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_SHARED_BUFFERS: 32MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 64MB
    networks:
      - kong-net
    ports:
      - "6789:5432"
    volumes:
      - kong-data:/var/lib/postgresql/data
    command:
      -c shared_buffers=32MB
      -c effective_cache_size=64MB
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  kong-bootstrap:
    image: kong:3.9-ubuntu
    depends_on:
      kong-database:
        condition: service_healthy    
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
      KONG_PG_USER: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    networks:
      - kong-net
  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
      KONG_PG_USER: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_MEM_CACHE_SIZE: 64m
      KONG_WORKER_PROCESSES: 2
    networks:
      - kong-net
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully   
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    command: "kong docker-start"
    deploy:
      resources:
        limits:
          memory: 256M

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    ports:
      - "8687:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - monitoring
    ports:
      - "9200:9200"

  # Monitoring
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS="--max-old-space-size=512"
    ports:
      - "5601:5601"
    networks:
      - monitoring
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.18.2
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - monitoring
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.18.2
    container_name: filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    networks:
      - monitoring
    depends_on:
      - logstash

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=500MB'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring
    ports:
      - "9090:9090"


  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    networks:
      - monitoring
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:12.0.1
    container_name: grafana
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    ports:
      - "3000:3000"
    networks:
      - monitoring
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/datasource:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  axonserver:
    image: axoniq/axonserver
    container_name: axonserver
    ports:
      - "8024:8024"   # Web UI
      - "8124:8124"   # gRPC (client kết nối)
    volumes:
      - axon_data:/axonserver/data
      - axon_events:/axonserver/events
      - axon_config:/axonserver/config
      - ./axon-log:/axonserver/log
    environment:
      - AXONIQ_AXONSERVER_DEVMODE_ENABLED=true  # Cho phép khởi động nhanh trong dev

volumes:
  jenkins_home:
  primary-data:
    driver: local
  secondary-data:
    driver: local
  kong-data:
    driver: local
  cassandra_data:
  esdata:
  grafana-storage:
  prometheus-data:
  axon_data:
  axon_events:
  axon_config:

networks:
  kong-net:
  monitoring:
    driver: bridge
  byteforce-net:
    driver: bridge
  backend:
    driver: bridge
