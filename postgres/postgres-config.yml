spring:
  datasource:
    primary:
      url: jdbc:postgresql://postgres-primary:5432/movie_db
      username: admin
      password: ${DB_PASSWORD:-password}
      driver-class-name: org.postgresql.Driver
    secondary:
      url: jdbc:postgresql://postgres-secondary:5432/movie_db
      username: admin
      password: ${DB_PASSWORD:-password}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always